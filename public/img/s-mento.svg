  <path d="M 140 120 C 150 200 170 270 210 310 C 235 330 265 330 290 310 C 330 270 350 200 360 120" fill="none" stroke="#F5DFD0" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Chin projection focal point -->
