<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBECE8"/>
      <stop offset="40%" stop-color="#E2E3DE"/>
      <stop offset="100%" stop-color="#D5D7D0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCEEE6"/>
      <stop offset="50%" stop-color="#F5DFD4"/>
      <stop offset="100%" stop-color="#E8C9BA"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3837"/>
      <stop offset="100%" stop-color="#232326"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFEFEF"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E2A8"/>
      <stop offset="50%" stop-color="#B8924A"/>
      <stop offset="100%" stop-color="#9C7A32"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgG)"/>
  <circle cx="400" cy="360" r="320" fill="url(#halo)"/>

  <!-- Subtle editorial geometry -->
  <circle cx="400" cy="380" r="280" fill="none" stroke="#B8924A" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="400" cy="380" r="295" fill="none" stroke="#E2DED6" stroke-width="0.8" stroke-dasharray="4 6"/>

  <!-- Coat / Shoulders -->
  <path d="M 220 1000 C 230 780 270 660 330 620 L 400 670 L 470 620 C 530 660 570 780 580 1000 Z" fill="url(#coat)"/>
  <!-- Lapels -->
  <path d="M 330 620 L 400 780 L 360 1000 L 260 1000 C 255 860 280 720 330 620 Z" fill="#F8F8F8" stroke="#E2DED6" stroke-width="1"/>
  <path d="M 470 620 L 400 780 L 440 1000 L 540 1000 C 545 860 520 720 470 620 Z" fill="#F4F4F4" stroke="#E2DED6" stroke-width="1"/>
  <!-- Gold Stethoscope / Pin -->
  <path d="M 380 680 C 370 740 375 790 395 820" fill="none" stroke="url(#goldAcc)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="395" cy="825" r="7" fill="url(#goldAcc)"/>

  <!-- Neck -->
  <path d="M 365 480 L 365 590 C 380 610 420 610 435 590 L 435 480 Z" fill="#E8C9BA"/>
  <path d="M 370 530 C 390 550 410 550 430 530" fill="none" stroke="#D5B09E" stroke-width="2" stroke-linecap="round"/>

  <!-- Hair Back -->
  <path d="M 290 320 C 270 430 280 570 320 640 L 350 630 C 310 540 310 420 320 340 Z" fill="url(#hair)"/>
  <path d="M 510 320 C 530 430 520 570 480 640 L 450 630 C 490 540 490 420 480 340 Z" fill="url(#hair)"/>

  <!-- Head / Face Oval -->
  <path d="M 330 330 C 330 240 470 240 470 330 C 470 420 435 490 400 490 C 365 490 330 420 330 330 Z" fill="url(#skin)"/>

  <!-- Hair Updo / Styling -->
  <path d="M 315 310 C 320 200 480 200 485 310 C 470 270 430 260 400 260 C 370 260 330 270 315 310 Z" fill="url(#hair)"/>
  <path d="M 320 310 C 340 340 370 320 400 310 C 430 320 460 340 480 310 C 470 290 440 280 400 280 C 360 280 330 290 320 310 Z" fill="#2E2C2B"/>

  <!-- Eyebrows -->
  <path d="M 350 335 C 365 330 380 332 388 338" fill="none" stroke="#3A3837" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 450 335 C 435 330 420 332 412 338" fill="none" stroke="#3A3837" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="370" cy="350" rx="11" ry="6" fill="#FFFFFF"/>
  <circle cx="370" cy="350" r="5" fill="#3B3835"/>
  <circle cx="372" cy="348" r="1.5" fill="#FFFFFF"/>
  <path d="M 357 348 C 365 343 376 343 383 348" fill="none" stroke="#232326" stroke-width="2" stroke-linecap="round"/>

  <ellipse cx="430" cy="350" rx="11" ry="6" fill="#FFFFFF"/>
  <circle cx="430" cy="350" r="5" fill="#3B3835"/>
  <circle cx="432" cy="348" r="1.5" fill="#FFFFFF"/>
  <path d="M 417 348 C 424 343 435 343 443 348" fill="none" stroke="#232326" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 400 345 L 398 385 C 394 388 406 388 402 385 Z" fill="none" stroke="#D5B09E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lips (Natural, Hydrated & Defined) -->
  <path d="M 382 415 C 392 410 408 410 418 415 C 410 425 390 425 382 415 Z" fill="#D98A80"/>
  <path d="M 383 415 C 393 420 407 420 417 415 C 413 427 387 427 383 415 Z" fill="#C9756C"/>
  <path d="M 388 418 C 395 419 405 419 412 418" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Subtle Cheeks & Lighting -->
  <ellipse cx="355" cy="375" rx="18" ry="10" fill="#F0A699" opacity="0.25"/>
  <ellipse cx="445" cy="375" rx="18" ry="10" fill="#F0A699" opacity="0.25"/>

  <!-- Gold Earrings -->
  <circle cx="328" cy="370" r="4" fill="url(#goldAcc)"/>
  <circle cx="472" cy="370" r="4" fill="url(#goldAcc)"/>

  <!-- Minimal watermark/seal -->
  <circle cx="680" cy="900" r="45" fill="none" stroke="url(#goldAcc)" stroke-width="1" opacity="0.4"/>
  <text x="680" y="897" font-family="'Cormorant Garamond', serif" font-size="10" fill="#9C7A32" text-anchor="middle" letter-spacing="2">DRA. HELENA</text>
  <text x="680" y="911" font-family="'Jost', sans-serif" font-size="7" fill="#6E6B68" text-anchor="middle" letter-spacing="1">ESPECIALISTA</text>
</svg>
