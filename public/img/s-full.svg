<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bgFull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2EFE8"/>
      <stop offset="100%" stop-color="#DEE0D8"/>
    </linearGradient>
    <radialGradient id="harmonyGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#EAE3D5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="400" fill="url(#bgFull)"/>
  <circle cx="250" cy="200" r="160" fill="url(#harmonyGlow)"/>

  <!-- Golden Facial Proportions Mask & Triangles -->
  <polygon points="250,70 170,220 330,220" fill="none" stroke="#B8924A" stroke-width="0.8" opacity="0.4"/>
  <polygon points="170,220 250,330 330,220" fill="none" stroke="#B8924A" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="250" cy="200" rx="90" ry="125" fill="#F8E5D8" opacity="0.85"/>
  <ellipse cx="250" cy="200" rx="90" ry="125" fill="none" stroke="#B8924A" stroke-width="1.2"/>

  <!-- Harmonic nodes -->
  <circle cx="250" cy="70" r="4" fill="#B8924A"/>
  <circle cx="170" cy="220" r="4" fill="#B8924A"/>
  <circle cx="330" cy="220" r="4" fill="#B8924A"/>
  <circle cx="250" cy="330" r="4" fill="#B8924A"/>

  <!-- Minimal facial features inside -->
  <line x1="220" y1="160" x2="240" y2="160" stroke="#363433" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="160" x2="280" y2="160" stroke="#363433" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="230" cy="172" rx="6" ry="3" fill="#363433"/>
  <ellipse cx="270" cy="172" rx="6" ry="3" fill="#363433"/>
  <path d="M 250 175 L 248 205 L 253 205" fill="none" stroke="#D2B09F" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 235 235 C 243 230 257 230 265 235 C 257 245 243 245 235 235 Z" fill="#D3827A"/>
</svg>
